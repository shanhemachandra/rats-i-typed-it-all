[package]
name = "rats-i-typed-it-all"
version = "0.1.1"
description = "Type text into any app, where paste does not reach."
authors = ["Shan"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "rats_i_typed_it_all_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
